name: Automorphic CI

on:
  pull_request:
  push:
    branches: [main, "automorphic/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automorphic-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-hygiene:
    name: Source release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Test source release tooling
        run: node --test scripts/source-release-check.test.mjs scripts/license-bundle.test.mjs
      - name: Reject private files and machine-specific dependencies
        run: node scripts/source-release-check.mjs
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          cd "$tool_dir"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$base/$asset" --output "$asset"
          curl --fail --silent --show-error --location "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output checksums.txt
          awk -v asset="$asset" '$2 == asset { print }' checksums.txt > selected.sha256
          test -s selected.sha256
          sha256sum --check selected.sha256
          tar -xzf "$asset" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan reachable Git history
        run: gitleaks git --redact --no-banner --log-opts=--all

  trading:
    name: Trading and account regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: false
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Install locked trading workspaces
        run: vp install --frozen-lockfile --filter=@t3tools/monorepo --filter=@t3tools/web... --filter=t3... --filter=@t3tools/scripts...
      - name: Chart and account tests
        working-directory: apps/web
        run: vp test run --project unit src/components/trading src/account/accountGateState.test.ts
      - name: Market data and trading server tests
        working-directory: apps/server
        run: vp test run src/trading
      - name: Session renewal tests
        run: node --test scripts/lib/tradovate-session.test.mjs
      - name: Web typecheck
        working-directory: apps/web
        run: vp exec tsc --noEmit
      - name: Server typecheck
        working-directory: apps/server
        run: vp exec tsc --noEmit
